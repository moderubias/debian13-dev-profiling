[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "debian13-dev-profiling"
version = "0.2.0a1"
description = "Conservative Debian 13 host security audit and deterministic configuration planning"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"

[project.urls]
Repository = "https://github.com/moderubias/debian13-dev-profiling"
Issues = "https://github.com/moderubias/debian13-dev-profiling/issues"

[project.scripts]
d13dp = "d13dp.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
d13dp = ["profiles/*.toml"]
