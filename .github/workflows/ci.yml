name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: PYTHONPATH=src python -m unittest discover -s tests -v
      - run: python -m compileall -q src tests
      - run: ./d13dp plan --profile docker
      - run: ./d13dp render --profile web --output build/web
      - run: ./d13dp render --profile web --output build/web
      - name: Build and test the installed wheel outside the checkout
        run: |
          python -m pip install build
          python -m build
          python -m venv /tmp/d13dp-installed
          /tmp/d13dp-installed/bin/pip install --no-deps dist/*.whl
          cd /tmp
          /tmp/d13dp-installed/bin/d13dp --help
          for profile in minimal web docker; do
            /tmp/d13dp-installed/bin/d13dp plan --profile "$profile"
            /tmp/d13dp-installed/bin/d13dp render --profile "$profile" --output "/tmp/d13dp-$profile"
            /tmp/d13dp-installed/bin/d13dp manifest --profile "$profile"
          done

  debian13:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build Debian 13 QA image
        run: docker build -t d13dp-qa -f tests/integration/Dockerfile .
      - name: Validate configuration in an isolated network namespace
        run: docker run --rm --network none --cap-add NET_ADMIN d13dp-qa
